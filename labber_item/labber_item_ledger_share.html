<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LABBER 아이템 목록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Gothic+A1:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f3f5f4; --surface: #ffffff; --surface-2: #eef1f0;
    --border: #dbe2df; --border-strong: #c3cdc9;
    --text: #16201c; --text-mute: #5c6a64; --text-faint: #93a09a;
    --accent: #1c9c81; --accent-soft: #dff3ee; --accent-strong: #0f7a63;
    --mono: 'JetBrains Mono', 'Consolas', monospace;
    --sans: 'Gothic A1', 'Pretendard', 'Malgun Gothic', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #10141a; --surface: #171d24; --surface-2: #1d242c;
      --border: #2a323b; --border-strong: #3a4650;
      --text: #e7ece9; --text-mute: #8b978f; --text-faint: #5c6862;
      --accent: #5fd9bc; --accent-soft: #16332c; --accent-strong: #7fe6cc;
    }
  }
  :root[data-theme="dark"]{
    --bg: #10141a; --surface: #171d24; --surface-2: #1d242c;
    --border: #2a323b; --border-strong: #3a4650;
    --text: #e7ece9; --text-mute: #8b978f; --text-faint: #5c6862;
    --accent: #5fd9bc; --accent-soft: #16332c; --accent-strong: #7fe6cc;
  }

  *{ box-sizing: border-box; }
  body{
    background: var(--bg); color: var(--text); font-family: var(--sans);
    font-size: 14px; line-height: 1.5;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }

  .cat-swatch{ display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:6px; flex-shrink:0; }
  .cat-연구용품{ --catc:#6aa6d8; } .cat-잡동사니{ --catc:#c9a26a; } .cat-기록물{ --catc:#a389d1; }
  .cat-표본{ --catc:#5fb894; } .cat-구내식당{ --catc:#e0a15e; } .cat-휴게실{ --catc:#d18ca0; }
  .cat-\?\?\?{ --catc:#c96a6a; }
  .cat-특성템\(포드\){ --catc:#4fb3c9; } .cat-특성템\(카트리지\){ --catc:#4f9ac9; }
  .cat-특성템\(서브젝트\){ --catc:#8a7fd6; } .cat-배양시약\(MYO\){ --catc:#6bbf6b; }
  .cat-기타{ --catc:#93a09a; }
  .cat-swatch{ background: var(--catc, var(--text-faint)); }

  .grade-swatch{ display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:6px; flex-shrink:0; }
  .grade-표준{ --gradec:#7dd8c8; } .grade-특이{ --gradec:#e8c96b; } .grade-제한{ --gradec:#f0a0a0; }
  .grade-\?\?\?{ --gradec:#a389d1; }
  .grade-swatch{ background: var(--gradec, var(--text-faint)); }

  .topbar{ flex:0 0 auto; background: var(--bg); border-bottom: 1px solid var(--border); padding: 18px 22px 14px; }
  .topbar-row{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .title-block h1{ margin:0; font-family: var(--mono); font-size: 19px; font-weight:700; letter-spacing:0.3px; text-wrap: balance; }
  .title-block p{ margin: 4px 0 0; font-size: 12.5px; color: var(--text-mute); }
  .eyebrow{ font-family: var(--mono); font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-strong); font-weight:700; margin-bottom:3px; display:block; }

  .readonly-pill{
    font-family: var(--mono); font-size: 11px; color: var(--text-mute);
    padding: 6px 12px; border:1px solid var(--border); border-radius: 999px; background: var(--surface);
    white-space: nowrap;
  }

  .toolbar-row{ display:flex; align-items:center; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .search-box{ position:relative; flex: 0 1 260px; }
  .search-box input{
    width:100%; padding: 8px 12px 8px 30px; border:1px solid var(--border); border-radius:8px;
    background: var(--surface); color: var(--text); font-family: var(--sans); font-size:13px;
  }
  .search-box input:focus{ outline:none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search-box svg{ position:absolute; left:9px; top:50%; transform:translateY(-50%); opacity:.5; }

  .chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{
    font-family: var(--mono); font-size:11.5px; padding:6px 12px; border-radius:999px;
    border:1px solid var(--border); background: var(--surface); color: var(--text-mute);
    cursor:pointer; white-space:nowrap; transition: all .12s ease; display:flex; align-items:center;
  }
  .chip:hover{ border-color: var(--border-strong); color: var(--text); }
  .chip.active{ background: var(--accent); border-color: var(--accent); color:#0c1613; font-weight:700; }
  .chip .n{ opacity:.7; margin-left:5px; }
  .chip.active .n{ opacity:.75; }

  .table-wrap{ flex:1 1 auto; min-height:0; overflow:auto; padding: 4px 22px 60px; }
  table{ border-collapse: collapse; width:100%; min-width: 1080px; }
  thead th{
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    text-align:left; font-family: var(--mono); font-size:10.5px; letter-spacing:1px; text-transform:uppercase;
    color: var(--text-mute); font-weight:600; padding: 10px 10px; border-bottom: 1px solid var(--border-strong);
    white-space: nowrap;
  }
  tbody tr{ border-bottom: 1px solid var(--border); }
  tbody tr:hover{ background: var(--surface-2); }
  td{ padding: 8px 10px; vertical-align: top; }

  .v-name{ font-weight:700; min-width: 140px; }
  .v-desc{ min-width: 220px; max-width: 320px; color: var(--text-mute); white-space: pre-wrap; }
  .v-mono{ font-family: var(--mono); font-size:12px; color: var(--text-mute); white-space: pre-wrap; }
  .v-plain{ color: var(--text); font-size:13px; }
  .col-cat{ min-width:110px; }
  .col-photo{ width: 64px; }
  .cat-tag{ display:flex; align-items:center; }

  .photo-box{
    width:52px; height:52px; border-radius:7px; border:1px dashed var(--border-strong);
    background: var(--surface-2); display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .photo-box img{ width:100%; height:100%; object-fit:cover; }
  .photo-box svg{ opacity:.35; }

  .empty-state{ padding: 80px 22px; text-align:center; color: var(--text-mute); font-size:13px; }

  ::selection{ background: var(--accent-soft); }

  @media (max-width: 720px){
    .topbar{ padding: 14px 14px 12px; }
    .table-wrap{ padding: 4px 14px 60px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div class="title-block">
      <span class="eyebrow">SPECIES LAB · LABBER</span>
      <h1>아이템 목록</h1>
      <p id="countLine"></p>
    </div>
    <div class="readonly-pill">읽기 전용</div>
  </div>
  <div class="toolbar-row">
    <div class="search-box">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="아이템명 검색…">
    </div>
    <div class="chips" id="chipRow"></div>
  </div>
</div>

<div class="table-wrap">
  <table id="itemTable" hidden>
    <thead>
      <tr>
        <th class="col-photo">사진</th>
        <th>파일명</th>
        <th class="col-cat">분류</th>
        <th class="col-cat">등급</th>
        <th>아이템명</th>
        <th>디자인</th>
        <th>획득처</th>
        <th>스테이지</th>
        <th>조합식</th>
        <th>설명</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty-state" id="emptyState" hidden>조건에 맞는 아이템이 없어요.</div>
</div>

이상어","grade":"표준","name":"출입등급 불명 카드","order":119,"photo":"","recipe":"","source":"","stage":""},{"id":"dogam_rare_03","category":"???","description":"대부분 손상되었지만 「LABBER」라는 단어만 남아 있다.","designer":"이상어","grade":"표준","name":"삭제된 연구기록","order":120,"photo":"","recipe":"","source":"","stage":""},{"id":"dogam_rare_04","category":"???","description":"연구소 지급품과 재질은 같지만 이런 색상의 가운은 존재하지 않는다.","designer":"이상어","grade":"표준","name":"검은색 가운 조각","order":121,"photo":"","recipe":"","source":"","stage":""},{"id":"dogam_rare_05","category":"???","description":"어떤 관리번호도 붙어 있지 않다.","designer":"이상어","grade":"표준","name":"번호 없는 샘플병","order":122,"photo":"","recipe":"","source":"","stage":""},{"id":"dogam_rare_06","category":"???","description":"현재 등록된 어떤 Pod 규격과도 일치하지 않는다.","designer":"이상어","grade":"표준","name":"미등록 Pod 파편","order":123,"photo":"","recipe":"","source":"","stage":""},{"id":"dogam_rare_07","category":"???","description":"색상 데이터가 존재하지 않는다.","designer":"이상어","grade":"표준","name":"무색 Ink 샘플","order":124,"photo":"","recipe":"","source":"","stage":""},{"id":"dogam_rare_08","category":"???","description":"내용물은 없다. 안쪽에서 긁은 흔적이 있다.","designer":"이상어","grade":"표준","name":"빈 Subject 케이스","order":125,"photo":"","recipe":"","source":"","stage":""},{"id":"dogam_rare_09","category":"???","description":"연구소 도면에는 B0라는 층이 없다.","designer":"이상어","grade":"표준","name":"「B0」 출입 카드","order":126,"photo":"","recipe":"","source":"","stage":""},{"id":"dogam_rare_10","category":"???","description":"「또 버렸군요.」라고 적혀 있다.","designer":"이상어","grade":"표준","name":"A의 메모 조각","order":127,"photo":"","recipe":"","source":"","stage":""}];

  const CATEGORY_PRIORITY = ['연구용품','잡동사니','기록물','표본','구내식당','휴게실','???',
    '특성템(포드)','특성템(카트리지)','특성템(서브젝트)','배양시약(MYO)'];

  let activeCategory = 'all';
  let searchTerm = '';

  function catClass(cat){ return 'cat-' + (cat || '기타'); }
  function gradeClass(grade){ return 'grade-' + (grade || '표준'); }

  function escapeHtml(s){
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderChips(){
    const counts = {};
    ITEMS.forEach(it => { const c = it.category || '기타'; counts[c] = (counts[c]||0) + 1; });
    const cats = Object.keys(counts).sort((a,b) => {
      const ia = CATEGORY_PRIORITY.indexOf(a), ib = CATEGORY_PRIORITY.indexOf(b);
      if (ia === -1 && ib === -1) return a.localeCompare(b);
      if (ia === -1) return 1;
      if (ib === -1) return -1;
      return ia - ib;
    });
    const chipRow = document.getElementById('chipRow');
    const chips = [`<button class="chip${activeCategory==='all'?' active':''}" data-cat="all">전체<span class="n">${ITEMS.length}</span></button>`]
      .concat(cats.map(c => `<button class="chip${activeCategory===c?' active':''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}<span class="n">${counts[c]}</span></button>`));
    chipRow.innerHTML = chips.join('');
    chipRow.querySelectorAll('.chip').forEach(btn => btn.addEventListener('click', () => {
      activeCategory = btn.dataset.cat;
      renderChips();
      render();
    }));
  }

  function render(){
    let rows = ITEMS;
    if (activeCategory !== 'all') rows = rows.filter(it => (it.category || '기타') === activeCategory);
    if (searchTerm) rows = rows.filter(it => (it.name || '').toLowerCase().includes(searchTerm));

    document.getElementById('countLine').textContent = `전체 ${ITEMS.length}개 중 ${rows.length}개 표시`;

    const table = document.getElementById('itemTable');
    const empty = document.getElementById('emptyState');
    if (!rows.length){ table.hidden = true; empty.hidden = false; return; }
    table.hidden = false; empty.hidden = true;
    document.getElementById('tbody').innerHTML = rows.map(rowHtml).join('');
  }

  function rowHtml(it){
    const photo = it.photo
      ? `<img src="${escapeHtml(it.photo)}" alt="">`
      : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg>`;
    return `<tr>
      <td class="col-photo"><div class="photo-box">${photo}</div></td>
      <td class="v-mono">${escapeHtml(it.filename)}</td>
      <td class="col-cat"><div class="cat-tag"><span class="cat-swatch ${catClass(it.category)}"></span><span class="v-plain">${escapeHtml(it.category)}</span></div></td>
      <td class="col-cat"><div class="cat-tag"><span class="grade-swatch ${gradeClass(it.grade)}"></span><span class="v-plain">${escapeHtml(it.grade)}</span></div></td>
      <td class="v-name">${escapeHtml(it.name)}</td>
      <td class="v-plain">${escapeHtml(it.designer)}</td>
      <td class="v-plain">${escapeHtml(it.source)}</td>
      <td class="v-mono">${escapeHtml(it.stage)}</td>
      <td class="v-mono">${escapeHtml(it.recipe)}</td>
      <td class="v-desc">${escapeHtml(it.description)}</td>
    </tr>`;
  }

  document.getElementById('searchInput').addEventListener('input', e => {
    searchTerm = e.target.value.trim().toLowerCase();
    render();
  });

  renderChips();
  render();
</script>

  :root{
    --bg: #f3f5f4;
    --surface: #ffffff;
    --surface-2: #eef1f0;
    --border: #dbe2df;
    --border-strong: #c3cdc9;
    --text: #16201c;
    --text-mute: #5c6a64;
    --text-faint: #93a09a;
    --accent: #1c9c81;
    --accent-soft: #dff3ee;
    --accent-strong: #0f7a63;
    --mono: 'JetBrains Mono', 'Consolas', monospace;
    --sans: 'Paperlogy', 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #10141a;
      --surface: #171d24;
      --surface-2: #1d242c;
      --border: #2a323b;
      --border-strong: #3a4650;
      --text: #e7ece9;
      --text-mute: #8b978f;
      --text-faint: #5c6862;
      --accent: #5fd9bc;
      --accent-soft: #16332c;
      --accent-strong: #7fe6cc;
    }
  }
  :root[data-theme="dark"]{
    --bg: #10141a;
    --surface: #171d24;
    --surface-2: #1d242c;
    --border: #2a323b;
    --border-strong: #3a4650;
    --text: #e7ece9;
    --text-mute: #8b978f;
    --text-faint: #5c6862;
    --accent: #5fd9bc;
    --accent-soft: #16332c;
    --accent-strong: #7fe6cc;
  }

  *{ box-sizing: border-box; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden; /* 페이지 자체는 스크롤하지 않는다 - 아래 .table-wrap 만 내부 스크롤 */
  }

  /* 대분류 색 태그 - major(대분류)/minor(소분류) 2축, 색은 major 기준으로만 표시 */
  .cat-swatch{ display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:6px; flex-shrink:0; }
  .cat-연구자료{ --catc:#6aa6d8; } .cat-연구소물품{ --catc:#c9a26a; }
  .cat-특성아이템{ --catc:#4fb3c9; }
  .cat-\?\?\?{ --catc:#c96a6a; }
  .cat-미분류{ --catc:#93a09a; }
  .cat-swatch{ background: var(--catc, var(--text-faint)); }

  .chips-sub{ width:100%; margin: -2px 0 0 2px; }

  .chips-sub .chip.active{

  }
  tbody tr{ border-bottom: 1px solid var(--border); }
  tbody tr:hover{ background: var(--surface-2); }
  td{ padding: 8px 10px; vertical-align: top; }

  .v-name{ font-weight:700; min-width: 140px; }

  .v-mono{ font-family: var(--mono); font-size:12px; color: var(--text-mute); white-space: pre-wrap; }
  .v-plain{ color: var(--text); font-size:13px; }
  .col-cat{ min-width:110px; }
  .col-photo{ width: 64px; }
  .cat-tag{ display:flex; align-items:center; }

  .photo-box{

  }
  .photo-box img{ width:100%; height:100%; object-fit:cover; }
  .photo-box svg{ opacity:.35; }

  .empty-state{ padding: 80px 22px; text-align:center; color: var(--text-mute); font-size:13px; }

  ::selection{ background: var(--accent-soft); }

  @media (max-width: 720px){
    .topbar{ padding: 14px 14px 12px; }
    .table-wrap{ padding: 4px 14px 60px; }
  }
</style>

    ITEMS.forEach(it => { if (it.major) majorCounts[it.major] = (majorCounts[it.major]||0) + 1; });

    const chipRow = document.getElementById('chipRow');
    const chip1 = [`<button class="chip${activeMajor==='all'?' active':''}" data-major="all">전체<span class="n">${ITEMS.length}</span></button>`]
      .concat(MAJOR_TABS.map(m => `<button class="chip${activeMajor===m?' active':''}" data-major="${escapeHtml(m)}">${escapeHtml(m)}<span class="n">${majorCounts[m]||0}</span></button>`));
    chipRow.innerHTML = chip1.join('');
    chipRow.querySelectorAll('.chip').forEach(btn => btn.addEventListener('click', () => {
      activeMajor = btn.dataset.major;
      activeMinor = 'all';
      renderChips();
      render();
    }));

    const chipSubRow = document.getElementById('chipSubRow');
    const minors = MINOR_TABS_BY_MAJOR[activeMajor];
    if (!minors) {
      chipSubRow.hidden = true;
      chipSubRow.innerHTML = '';
    } else {
      const minorCounts = {};
      ITEMS.forEach(it => { if (it.major === activeMajor && it.minor) minorCounts[it.minor] = (minorCounts[it.minor]||0) + 1; });
      const majorTotal = majorCounts[activeMajor] || 0;
      const chip2 = [`<button class="chip${activeMinor==='all'?' active':''}" data-minor="all">전체<span class="n">${majorTotal}</span></button>`]
        .concat(minors.map(m => `<button class="chip${activeMinor===m?' active':''}" data-minor="${escapeHtml(m)}">${escapeHtml(m)}<span class="n">${minorCounts[m]||0}</span></button>`));
      chipSubRow.innerHTML = chip2.join('');
      chipSubRow.hidden = false;
      chipSubRow.querySelectorAll('.chip').forEach(btn => btn.addEventListener('click', () => {
        activeMinor = btn.dataset.minor;
        renderChips();
        render();
      }));
    }

    const note = document.getElementById('unclassifiedNote');
    const unclassifiedCount = ITEMS.filter(it => !it.major).length;
    if (unclassifiedCount > 0) {
      note.textContent = `미분류 ${unclassifiedCount}개 - 대분류 미배정`;
      note.hidden = false;
    } else {
      note.hidden = true;
    }
  }

  function render(){
    let rows = ITEMS;
    if (activeMajor !== 'all') {
      rows = rows.filter(it => it.major === activeMajor);
      if (MINOR_TABS_BY_MAJOR[activeMajor] && activeMinor !== 'all') {
        rows = rows.filter(it => it.minor === activeMinor);
      }
    }
    if (searchTerm) rows = rows.filter(it => (it.name || '').toLowerCase().includes(searchTerm));

    document.getElementById('countLine').textContent = `전체 ${ITEMS.length}개 중 ${rows.length}개 표시`;

    const table = document.getElementById('itemTable');
    const empty = document.getElementById('emptyState');
    if (!rows.length){ table.hidden = true; empty.hidden = false; return; }
    table.hidden = false; empty.hidden = true;
    document.getElementById('tbody').innerHTML = rows.map(rowHtml).join('');
  }

  function rowHtml(it){
    const photo = it.photo
      ? `<img src="${escapeHtml(it.photo)}" alt="">`
      : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg>`;
    const legacyHint = (!it.major && it.category)
      ? `<div class="legacy-hint">구분류: ${escapeHtml(it.category)}</div>` : '';

    return `<tr>
      <td class="col-photo"><div class="photo-box">${photo}</div></td>
      <td class="v-mono">${escapeHtml(it.filename)}</td>
      <td class="col-cat"><div class="cat-tag"><span class="cat-swatch ${majorClass(it.major)}"></span><span class="v-plain">${escapeHtml(it.major)}</span></div></td>
      <td class="col-cat"><span class="v-plain">${escapeHtml(it.minor)}</span>${legacyHint}</td>
      <td class="col-cat"><div class="cat-tag"><span class="grade-swatch ${gradeClass(it.grade)}"></span><span class="v-plain">${escapeHtml(it.grade)}</span></div></td>
      <td class="v-name">${escapeHtml(it.name)}</td>
      <td class="v-plain">${escapeHtml(it.designer)}</td>
      <td class="v-plain">${escapeHtml(it.source)}</td>
      <td class="v-mono">${escapeHtml(it.stage)}</td>
      <td class="v-mono">${escapeHtml(it.recipe)}</td>
      <td class="v-desc">${escapeHtml(it.description)}</td>
    </tr>`;
  }

  document.getElementById('searchInput').addEventListener('input', e => {
    searchTerm = e.target.value.trim().toLowerCase();
    render();
  });

  renderChips();
  render();
</script>

</body>
</html>
